<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilip Mudiraj | 3D Ludo Arena</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: #0b0f19; 
      color: #f8fafc; 
      padding-bottom: 50px; 
      user-select: none; 
      -webkit-user-select: none; 
      overflow-x: hidden;
      text-align: center;
    }

    header {
      background: #111827;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      border-bottom: 1px solid #1f2937;
      letter-spacing: 1px;
    }
    .container { max-width: 440px; margin: 10px auto; padding: 0 10px; }

    /* లాబీ కార్డ్ */
    .lobby-box {
      background: #111827;
      border-radius: 12px;
      padding: 16px;
      border: 2px solid #ef4444;
      margin-bottom: 15px;
    }
    .lobby-box h2 { font-size: 18px; color: #ef4444; margin-bottom: 10px; }
    input {
      width: 80%;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #ef4444;
      background: #0b0f19;
      color: #38bdf8;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }
    .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
    .btn {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-red { background: #dc2626; color: white; }
    .btn-blue { background: #2563eb; color: white; }
    .btn-offline { background: #10b981; color: white; margin-top: 5px; }

    /* స్టేటస్ */
    #status-msg {
      font-size: 13px;
      color: #38bdf8;
      margin: 8px 0;
      font-weight: bold;
    }

    /* 3D DICE */
    .dice-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      perspective: 600px;
    }
    .dice-scene {
      width: 55px;
      height: 55px;
      cursor: pointer;
    }
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-27px);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1.2);
    }
    .cube-face {
      position: absolute;
      width: 55px;
      height: 55px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      display: grid;
      padding: 5px;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.2);
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #0f172a;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
    }
    .dot.red-dot { background: #dc2626; width: 14px; height: 14px; }
    .face-1 { transform: rotateY(0deg) translateZ(27px); display: flex; align-items: center; justify-content: center; }
    .face-6 { transform: rotateY(180deg) translateZ(27px); grid-template-columns: 1fr 1fr; }
    .face-2 { transform: rotateY(90deg) translateZ(27px); grid-template-columns: 1fr 1fr; }
    .face-2 .dot:nth-child(2) { grid-column: 2; align-self: flex-end; }
    .face-5 { transform: rotateY(-90deg) translateZ(27px); grid-template-columns: 1fr 1fr; }
    .face-5 .dot:nth-child(3) { grid-column: span 2; }
    .face-3 { transform: rotateX(90deg) translateZ(27px); grid-template-columns: 1fr 1fr 1fr; }
    .face-3 .dot:nth-child(2) { align-self: center; }
    .face-3 .dot:nth-child(3) { align-self: flex-end; }
    .face-4 { transform: rotateX(-90deg) translateZ(27px); grid-template-columns: 1fr 1fr; }

    /* లూడో బోర్డు (11x11 Grid) */
    .ludo-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1;
      margin: 8px auto;
      background: #ffffff;
      border: 4px solid #1e293b;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(11, 1fr);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      position: relative;
    }
    .l-cell {
      border: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #f8fafc;
    }
    .home-box {
      grid-column: span 4;
      grid-row: span 4;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 10px;
      align-items: center;
      justify-items: center;
    }
    .home-red { grid-column: 1 / 5; grid-row: 1 / 5; background: #ef4444; }
    .home-blue { grid-column: 8 / 12; grid-row: 8 / 12; background: #3b82f6; }
    .home-green { grid-column: 8 / 12; grid-row: 1 / 5; background: #16a34a; }
    .home-yellow { grid-column: 1 / 5; grid-row: 8 / 12; background: #ca8a04; }
    .pocket {
      width: 26px;
      height: 26px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #0f172a;
    }
    .center-home {
      grid-column: 5 / 8;
      grid-row: 5 / 8;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fbbf24;
      font-size: 13px;
      border: 2px solid #fbbf24;
      font-weight: bold;
    }
    .star-cell { background: #fef08a !important; }
    .star-cell::after { content: "★"; font-size: 14px; color: #ca8a04; }

    /* కాయిన్స్ */
    .token {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 5px rgba(0,0,0,0.6);
      cursor: pointer;
      display: inline-block;
      transition: transform 0.2s;
    }
    .token.red { background: #dc2626; }
    .token.blue { background: #2563eb; }
    .token.clickable {
      animation: bounce 0.5s infinite alternate;
      outline: 3px solid #fbbf24;
    }
    @keyframes bounce {
      from { transform: scale(1); }
      to { transform: scale(1.35); }
    }

    /* విన్నర్ పాప్-అప్ */
    #winner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .trophy-icon {
      font-size: 90px;
      animation: popUp 0.8s ease infinite alternate;
    }
    @keyframes popUp {
      0% { transform: scale(0.8) translateY(0); }
      100% { transform: scale(1.15) translateY(-15px); }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>DILIP MUDIRAJ | 3D LUDO</header>

  <div class="container">

    <!-- రూమ్ లాబీ -->
    <div class="lobby-box" id="lobby">
      <h2>🎲 Ludo Game Room</h2>
      <input type="number" id="custom-room" placeholder="రూమ్ కోడ్ (ఉదా: 111)" value="111">
      
      <div class="btn-row">
        <button class="btn btn-red" onclick="startHost()">Player 1 (Host - Red)</button>
        <button class="btn btn-blue" onclick="startJoin()">Player 2 (Join - Blue)</button>
      </div>

      <button class="btn btn-offline" onclick="startOffline()">📱 ఒకే ఫోన్‌లో ఇద్దరూ ఆడండి (Offline Mode)</button>

      <div id="status-msg">కోడ్ కొట్టి బటన్ నొక్కండి</div>
    </div>

    <!-- గేమ్ స్క్రీన్ -->
    <div id="game-play" style="display:none;">
      <div id="turn-banner" style="font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 4px;">మ్యాచ్ రెడీ!</div>
      
      <!-- 3D DICE -->
      <div class="dice-area">
        <div class="dice-scene" onclick="rollDice()">
          <div class="cube" id="diceCube">
            <div class="cube-face face-1"><div class="dot red-dot"></div></div>
            <div class="cube-face face-6">
              <div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div>
            </div>
            <div class="cube-face face-2"><div class="dot"></div><div class="dot"></div></div>
            <div class="cube-face face-5">
              <div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="cube-face face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="cube-face face-4">
              <div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div>
            </div>
          </div>
        </div>
        <small style="color:#fbbf24; font-size:12px; margin-top:6px; font-weight:bold;" id="dice-instruction">డైస్ మీద క్లిక్ చేయండి</small>
      </div>

      <!-- బోర్డు -->
      <div class="ludo-container" id="ludoBoard">
        <div class="home-box home-red">
          <div class="pocket" id="r-pocket-0"></div>
          <div class="pocket" id="r-pocket-1"></div>
          <div class="pocket" id="r-pocket-2"></div>
          <div class="pocket" id="r-pocket-3"></div>
        </div>
        <div class="home-box home-green"></div>
        <div class="home-box home-yellow"></div>
        
        <div class="home-box home-blue">
          <div class="pocket" id="b-pocket-0"></div>
          <div class="pocket" id="b-pocket-1"></div>
          <div class="pocket" id="b-pocket-2"></div>
          <div class="pocket" id="b-pocket-3"></div>
        </div>
        
        <div class="center-home">
          🏆 HOME
          <div style="font-size:10px; margin-top:3px;" id="home-count">R:0 | B:0</div>
        </div>
      </div>
    </div>

  </div>

  <!-- విన్నర్ ట్రోఫీ -->
  <div id="winner-modal">
    <div class="trophy-icon">🏆</div>
    <div style="font-size:26px; font-weight:bold; color:#fbbf24; margin-top:15px;" id="winner-text">YOU WON!</div>
    <button class="btn" style="background:#38bdf8; margin-top:20px; color:black; padding:12px 24px; font-size:16px;" onclick="location.reload()">మళ్లీ ఆడండి</button>
  </div>

  <script>
    // --- పక్కాగా పనిచేసే ఆడియో సౌండ్ ఇంజిన్ ---
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function soundDice() {
      try {
        const ctx = getAudio();
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(160 + Math.random() * 80, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.04);
          }, i * 60);
        }
      } catch(e){}
    }

    function soundStep() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(500, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.07);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.07);
      } catch(e){}
    }

    function soundCut() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch(e){}
    }

    function soundWin() {
      try {
        const ctx = getAudio();
        [260, 330, 390, 520, 660, 780].forEach((freq, i) => {
          setTimeout(() => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
          }, i * 130);
        });
      } catch(e){}
    }

    // లూడో బోర్డు పాత్
    const PATH = [
      {r:5, c:1}, {r:5, c:2}, {r:5, c:3}, {r:5, c:4}, 
      {r:4, c:5}, {r:3, c:5}, {r:2, c:5}, {r:1, c:5}, {r:1, c:6}, {r:1, c:7},
      {r:2, c:7}, {r:3, c:7}, {r:4, c:7}, {r:5, c:8}, {r:5, c:9}, {r:5, c:10}, {r:5, c:11},
      {r:6, c:11}, {r:7, c:11}, {r:7, c:10}, {r:7, c:9}, {r:7, c:8},
      {r:8, c:7}, {r:9, c:7}, {r:10, c:7}, {r:11, c:7}, {r:11, c:6}, {r:11, c:5},
      {r:10, c:5}, {r:9, c:5}, {r:8, c:5}, {r:7, c:4}, {r:7, c:3}, {r:7, c:2}, {r:7, c:1},
      {r:6, c:1}, {r:6, c:2}, {r:6, c:3}, {r:6, c:4}, {r:6, c:5}
    ];

    const SAFE_SPOTS = [0, 8, 17, 26];
    const WIN_STEP = PATH.length - 1;

    let peer = null, conn = null;
    let isOffline = false;
    let myColor = 'red';
    let currentTurn = 'red';
    let currentDice = null;
    let awaitingSelection = false;

    let tokens = {
      red: [-1, -1, -1, -1],
      blue: [-1, -1, -1, -1]
    };

    // గడులు రెండర్
    const boardEl = document.getElementById('ludoBoard');
    PATH.forEach((pt, idx) => {
      const cell = document.createElement('div');
      cell.className = 'l-cell';
      cell.style.gridRow = pt.r;
      cell.style.gridColumn = pt.c;
      cell.id = `cell-${pt.r}-${pt.c}`;
      if (SAFE_SPOTS.includes(idx)) cell.classList.add('star-cell');
      if (idx === WIN_STEP) cell.style.background = "#86efac";
      boardEl.appendChild(cell);
    });

    // 1. హోస్ట్ మోడ్
    function startHost() {
      getAudio();
      const code = document.getElementById('custom-room').value.trim() || '111';
      myColor = 'red';
      isOffline = false;
      document.getElementById('status-msg').innerText = "సర్వర్‌తో కనెక్ట్ అవుతోంది...";

      try {
        peer = new Peer('ludo-' + code);
        peer.on('open', () => {
          openGameView("రూమ్ " + code + " సిద్ధమైంది! ఫ్రెండ్‌ను Player 2 కొట్టమనండి.");
        });
        peer.on('connection', (c) => {
          conn = c;
          document.getElementById('turn-banner').innerText = "ఫ్రెండ్ కనెక్ట్ అయ్యారు! మీరే RED (మీ టర్న్).";
          setupNet();
        });
        peer.on('error', (err) => {
          // ఒకవేళ ఐడీ ఆల్రెడీ ఉంటే డైరెక్ట్‌గా గేమ్‌లోకి పంపుతుంది
          openGameView("మ్యాచ్ ఓపెన్ అయింది! (RED)");
        });
      } catch(e) {
        openGameView("మ్యాచ్ ఓపెన్ అయింది!");
      }
    }

    // 2. జాయిన్ మోడ్
    function startJoin() {
      getAudio();
      const code = document.getElementById('custom-room').value.trim() || '111';
      myColor = 'blue';
      isOffline = false;
      document.getElementById('status-msg').innerText = "కనెక్ట్ అవుతోంది...";

      try {
        peer = new Peer();
        peer.on('open', () => {
          conn = peer.connect('ludo-' + code);
          openGameView("రూమ్‌లో జాయిన్ అయ్యారు! మీరు BLUE.");
          setupNet();
        });
        peer.on('error', () => openGameView("కనెక్ట్ అయింది! మీరు BLUE."));
      } catch(e) {
        openGameView("కనెక్ట్ అయింది! మీరు BLUE.");
      }
    }

    // 3. ఆఫ్‌లైన్ మోడ్ (ఒకే ఫోన్‌లో ఇద్దరూ ఆడటానికి)
    function startOffline() {
      getAudio();
      isOffline = true;
      myColor = 'both';
      currentTurn = 'red';
      openGameView("ఒకే ఫోన్‌లో మ్యాచ్ సిద్ధమైంది! RED మొదట ఆడండి.");
    }

    function openGameView(msg) {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game-play').style.display = 'block';
      document.getElementById('turn-banner').innerText = msg;
      renderTokens();
    }

    function setupNet() {
      if (!conn) return;
      conn.on('data', (data) => {
        if(data.type === 'state') {
          tokens = data.tokens;
          currentTurn = data.nextTurn;
          animateDice(data.dice);
          renderTokens();
          if (data.alertMsg) { soundCut(); alert(data.alertMsg); }
          if (data.winner) showWinModal(data.winner);
        }
      });
    }

    // 3D డైస్ యానిమేషన్
    function animateDice(val) {
      const cube = document.getElementById('diceCube');
      soundDice();
      const rots = {
        1: { x: 0, y: 0 },
        6: { x: 0, y: 180 },
        2: { x: 0, y: -90 },
        5: { x: 0, y: 90 },
        3: { x: -90, y: 0 },
        4: { x: 90, y: 0 }
      };
      const r = rots[val] || { x: 0, y: 0 };
      cube.style.transform = `translateZ(-27px) rotateX(${r.x + 720}deg) rotateY(${r.y + 720}deg)`;
    }

    // డైస్ రోల్ లాజిక్
    function rollDice() {
      getAudio();
      if (!isOffline && currentTurn !== myColor) {
        return alert("ఇది మీ టర్న్ కాదు! వేచి ఉండండి.");
      }
      if (awaitingSelection) {
        return alert("దయచేసి కాయిన్‌ను సెలెక్ట్ చేయండి!");
      }

      currentDice = Math.floor(Math.random() * 6) + 1;
      animateDice(currentDice);
      document.getElementById('dice-instruction').innerText = `పడిన నంబర్: ${currentDice}`;

      const activeColor = currentTurn;
      const myTokens = tokens[activeColor];

      let movable = [];
      myTokens.forEach((pos, idx) => {
        if (pos === -1 && currentDice === 6) movable.push(idx);
        else if (pos !== -1 && pos + currentDice <= WIN_STEP) movable.push(idx);
      });

      if (movable.length === 0) {
        document.getElementById('dice-instruction').innerText = "కదిలే అవకాశం లేదు!";
        setTimeout(() => switchTurn(null), 900);
      } else if (movable.length === 1 && myTokens[movable[0]] === -1 && currentDice === 6) {
        setTimeout(() => executeMove(movable[0]), 700);
      } else {
        awaitingSelection = true;
        document.getElementById('dice-instruction').innerText = "బోర్డుపై కాయిన్‌ను టచ్ చేయండి!";
        highlightTokens(activeColor, movable);
      }
    }

    function highlightTokens(color, indices) {
      indices.forEach(idx => {
        const el = document.getElementById(`tok-${color}-${idx}`);
        if (el) el.classList.add('clickable');
      });
    }

    function handleTokenClick(color, idx) {
      if (!awaitingSelection) return;
      if (!isOffline && color !== myColor) return;
      if (color !== currentTurn) return;
