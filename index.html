<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    
    /* 1. Login Page Styles */
    #login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #df7e51;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 30px;
      border-radius: 14px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .login-card h2 { margin-bottom: 8px; font-size: 22px; }
    .login-card p { font-size: 12px; margin-bottom: 18px; opacity: 0.9; }
    .input-box {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
      background: #ffffff;
      color: #333;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #ea580c;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    /* 2. Main Website Styles */
    #main-website {
      display: none;
      min-height: 100vh;
      background: #0f172a;
      color: white;
    }
    header {
      background: #1e293b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .brand { font-size: 18px; font-weight: bold; color: #38bdf8; }
    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .content {
      padding: 40px 20px;
      text-align: center;
    }
    .content h1 { font-size: 24px; color: #f8fafc; margin-bottom: 8px; }
    .content p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #334155;
      text-align: left;
    }
    .box h3 { color: #38bdf8; font-size: 16px; margin-bottom: 6px; }
    .box p { color: #cbd5e1; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>

  <div id="login-page">
    <div class="login-card">
      <div style="font-size: 50px; margin-bottom: 10px;">🚶‍♂️🧳</div>
      <h2>Welcome Back</h2>
      <p>Enter details to access your portal</p>
      
      <form onsubmit="openWebsite(event)">
        <input type="text" class="input-box" placeholder="Username" required>
        <input type="password" class="input-box" placeholder="Password" required>
        <button type="submit" class="btn">LOGIN</button>
      </form>
    </div>
  </div>

  <div id="main-website">
    <header>
      <div class="brand">DILIP'S PORTAL</div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <div class="content">
      <h1>Welcome to My Website</h1>
      <p>Official portfolio and dashboard</p>

      <div class="box">
        <h3>📷 Photography</h3>
        <p>Portfolio of creative portrait shots and photo edits.</p>
      </div>

      <div class="box">
        <h3>💻 Web Development</h3>
        <p>Built and hosted directly using mobile Termux environment.</p>
      </div>
    </div>
  </div>

  <script>
    function openWebsite(e) {
      e.preventDefault();
      // ఇక్కడ ఎలాంటి చెకింగ్ లేకుండా నేరుగా వెబ్‌సైట్ ఓపెన్ అవుతుంది
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('main-website').style.display = 'block';
    }

    function logout() {
      document.getElementById('main-website').style.display = 'none';
      document.getElementById('login-page').style.display = 'flex';
    }
  </script>

</body>
</html>
