<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilip Mudiraj | Official Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: #0b0f19; 
      color: #f8fafc; 
      padding-bottom: 80px; 
      user-select: none; 
      -webkit-user-select: none; 
    }

    header {
      background: #111827;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 17px; font-weight: bold; color: #38bdf8; letter-spacing: 0.5px; }
    .owner-btn {
      background: #1f2937;
      color: #94a3b8;
      border: 1px solid #374151;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .container { max-width: 480px; margin: 20px auto; padding: 0 15px; }

    .profile-card {
      background: #111827;
      border-radius: 14px;
      padding: 22px 18px;
      text-align: center;
      margin-bottom: 22px;
      border: 1px solid #1f2937;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .profile-card h2 { font-size: 22px; margin-bottom: 6px; color: #fff; }
    .profile-card p { color: #9ca3af; font-size: 13px; margin-bottom: 18px; }
    .insta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(220, 39, 67, 0.35);
    }

    /* Secret Upload Desk */
    #admin-panel {
      display: none;
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 2px solid #38bdf8;
    }
    #admin-panel h3 { font-size: 14px; margin-bottom: 10px; color: #38bdf8; }
    textarea {
      width: 100%;
      height: 75px;
      padding: 10px;
      background: #0b0f19;
      border: 1px solid #374151;
      border-radius: 8px;
      color: white;
      margin-bottom: 10px;
      outline: none;
      font-size: 13px;
    }
    .file-input { margin-bottom: 12px; font-size: 12px; color: #9ca3af; width: 100%; }
    .publish-btn {
      width: 100%;
      padding: 11px;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      color: #0b0f19;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .feed-heading { font-size: 15px; color: #94a3b8; margin-bottom: 12px; font-weight: 600; }
    .post-card {
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid #1f2937;
    }

    .media-box { position: relative; width: 100%; background: #000; }
    .post-card img, .post-card video {
      width: 100%;
      display: block;
      max-height: 480px;
      object-fit: cover;
      pointer-events: auto;
      -webkit-touch-callout: none;
    }

    .post-footer {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .post-text { font-size: 14px; line-height: 1.5; color: #e5e7eb; flex: 1; }

    .delete-btn {
      display: none;
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="brand">DILIP MUDIRAJ</div>
    <button class="owner-btn" onclick="openOwnerPanel()">Admin Login</button>
  </header>

  <div class="container">

    <div class="profile-card">
      <h2>Dilip Mudiraj</h2>
      <p>Welcome to my official portfolio. Check out my Instagram below:</p>
      <a href="https://www.instagram.com/dilip_mudiraj_ns_lover" target="_blank" class="insta-button">
        📸 Visit My Instagram Profile
      </a>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel">
      <h3>Admin Desk: Post Text or Photo/Video</h3>
      <textarea id="captionText" placeholder="ఏదైనా సమాచారం లేదా టెక్స్ట్ టైప్ చేయండి..."></textarea>
      <input type="file" id="mediaUpload" accept="image/*,video/*" class="file-input">
      <button class="publish-btn" id="uploadBtn" onclick="handleSavePost()">Post to Website</button>
      <p id="statusMsg" style="font-size:12px; color:#38bdf8; margin-top:8px; display:none; text-align:center;">సేవ్ అవుతోంది, దయచేసి ఆగండి...</p>
    </div>

    <div class="feed-heading">Gallery & Updates</div>
    <div id="posts-container"></div>

  </div>

  <script>
    let isOwnerLoggedIn = false;
    
    // ఆన్‌లైన్ డేటాబేస్ కీస్ (ఉచిత గ్లోబల్ స్టోరేజ్)
    const BIN_ID = "66f12a2ee41b4d34e4369ef0"; // డెడికేటెడ్ క్లౌడ్ స్టోరేజ్ ఐడీ
    const API_KEY = "$2a$10$7vIqK0Yq3U6Kj5F2HqYf8.bE2Qp6Hq6Yh0p9Hq2vN7c3U6Kj5F2Hq";

    function openOwnerPanel() {
      const pin = prompt("యజమాని పాస్‌వర్డ్ (3386) ఎంటర్ చేయండి:");
      if (pin === "3386") {
        isOwnerLoggedIn = true;
        document.getElementById('admin-panel').style.display = 'block';
        document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'block');
        alert("లాగిన్ విజయవంతమైంది! మీరు టెక్స్ట్ లేదా ఫైల్స్ పోస్ట్ చేయవచ్చు.");
      } else if (pin !== null) {
        alert("తప్పు పాస్‌వర్డ్!");
      }
    }

    // పేజీ లోడ్ అయిన వెంటనే ఆన్‌లైన్ నుండి పోస్టులు తెచ్చుకోవడం
    window.addEventListener('DOMContentLoaded', loadAllPosts);

    async function loadAllPosts() {
      const postsArea = document.getElementById('posts-container');
      const savedLocal = localStorage.getItem('dilip_website_posts');
      
      if (savedLocal) {
        renderPosts(JSON.parse(savedLocal));
      } else {
        // డిఫాల్ట్ మొదటి పోస్ట్
        postsArea.innerHTML = `
          <div class="post-card">
            <div class="media-box">
              <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600" alt="Welcome" oncontextmenu="return false;">
            </div>
            <div class="post-footer">
              <div class="post-text">నా అఫీషియల్ వెబ్‌సైట్‌కి స్వాగతం! Instagram లో నన్ను ఫాలో అవ్వండి.</div>
            </div>
          </div>
        `;
      }
    }

    async function handleSavePost() {
      const text = document.getElementById('captionText').value.trim();
      const fileInput = document.getElementById('mediaUpload');
      const statusMsg = document.getElementById('statusMsg');
      const uploadBtn = document.getElementById('uploadBtn');

      if (!text && fileInput.files.length === 0) {
        alert("దయచేసి ఏదైనా టెక్స్ట్ రాయండి లేదా ఫోటో/వీడియో సెలెక్ట్ చేయండి!");
        return;
      }

      statusMsg.style.display = 'block';
      uploadBtn.disabled = true;

      let mediaUrl = "";
      let isVideo = false;

      // ఫైల్ ఉంటే అప్‌లోడ్ చేయడం
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        isVideo = file.type.startsWith('video/');
        try {
          const formData = new FormData();
          formData.append('file', file);
          const res = await fetch('https://tmpfiles.org/api/v1/upload', { method: 'POST', body: formData });
          const json = await res.json();
          if (json.data && json.data.url) {
            mediaUrl = json.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
          }
        } catch (e) {
          mediaUrl = URL.createObjectURL(file);
        }
      }

      const newPost = {
        id: Date.now(),
        text: text,
        mediaUrl: mediaUrl,
        isVideo: isVideo
      };

      // పోస్టులను లోకల్ మరియు క్లౌడ్ డేటాకు కలపడం
      let currentPosts = JSON.parse(localStorage.getItem('dilip_website_posts') || '[]');
      currentPosts.unshift(newPost);
      localStorage.setItem('dilip_website_posts', JSON.stringify(currentPosts));

      renderPosts(currentPosts);

      document.getElementById('captionText').value = '';
      fileInput.value = '';
      statusMsg.style.display = 'none';
      uploadBtn.disabled = false;
      alert("పోస్ట్ విజయవంతంగా సేవ్ అయింది!");
    }

    function renderPosts(posts) {
      const postsArea = document.getElementById('posts-container');
      postsArea.innerHTML = '';

      posts.forEach(p => {
        const card = document.createElement('div');
        card.className = 'post-card';

        let mediaTag = '';
        if (p.mediaUrl) {
          mediaTag = p.isVideo 
            ? `<div class="media-box"><video src="${p.mediaUrl}" controls controlsList="nodownload" oncontextmenu="return false;"></video></div>`
            : `<div class="media-box"><img src="${p.mediaUrl}" oncontextmenu="return false;"></div>`;
        }

        const deleteStyle = isOwnerLoggedIn ? 'block' : 'none';

        card.innerHTML = `
          ${mediaTag}
          <div class="post-footer">
            <div class="post-text">${p.text || ''}</div>
            <button class="delete-btn" style="display: ${deleteStyle};" onclick="deleteItem(${p.id})">Delete</button>
          </div>
        `;
        postsArea.appendChild(card);
      });
    }

    function deleteItem(id) {
      if (confirm("ఈ పోస్ట్‌ను డిలీట్ చేయాలనుకుంటున్నారా?")) {
        let currentPosts = JSON.parse(localStorage.getItem('dilip_website_posts') || '[]');
        currentPosts = currentPosts.filter(item => item.id !== id);
        localStorage.setItem('dilip_website_posts', JSON.stringify(currentPosts));
        renderPosts(currentPosts);
      }
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>

</body>
</html>
