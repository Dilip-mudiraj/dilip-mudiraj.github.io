<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilip Mudiraj | Real Ludo Arena</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: #0b0f19; 
      color: #f8fafc; 
      padding-bottom: 60px; 
      user-select: none; 
      -webkit-user-select: none; 
      overflow-x: hidden;
    }

    header {
      background: #111827;
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #1f2937;
      font-size: 17px;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .container { max-width: 440px; margin: 15px auto; padding: 0 10px; }

    /* లాబీ బాక్స్ */
    .lobby-card {
      background: #111827;
      border-radius: 12px;
      padding: 14px;
      border: 2px solid #ef4444;
      text-align: center;
      margin-bottom: 15px;
    }
    input {
      width: 75%;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #ef4444;
      background: #0b0f19;
      color: #ef4444;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      outline: none;
    }
    .btn-group { display: flex; gap: 8px; justify-content: center; }
    .btn {
      padding: 9px 15px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-host { background: #ef4444; color: white; }
    .btn-join { background: #3b82f6; color: white; }

    /* రియల్ లూడో బోర్డు (Square Grid) */
    .ludo-container {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1;
      margin: 10px auto;
      background: #ffffff;
      border: 4px solid #1e293b;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(11, 1fr);
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      position: relative;
    }

    .l-cell {
      border: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #f8fafc;
      font-size: 10px;
      font-weight: bold;
      color: #475569;
    }

    /* హోమ్ ఏరియాలు */
    .home-box {
      grid-column: span 4;
      grid-row: span 4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    .home-red { grid-column: 1 / 5; grid-row: 1 / 5; background: #ef4444; }
    .home-blue { grid-column: 8 / 12; grid-row: 8 / 12; background: #3b82f6; }
    .home-green { grid-column: 8 / 12; grid-row: 1 / 5; background: #22c55e; }
    .home-yellow { grid-column: 1 / 5; grid-row: 8 / 12; background: #eab308; }

    .inner-base {
      width: 75%;
      height: 75%;
      background: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      color: #1e293b;
    }

    /* సెంటర్ విన్నింగ్ హోమ్ */
    .center-home {
      grid-column: 5 / 8;
      grid-row: 5 / 8;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fbbf24;
      font-size: 20px;
      border: 2px solid #fbbf24;
    }

    /* సేఫ్ స్టార్ & కలర్ జోన్లు */
    .star-cell { background: #fef08a !important; }
    .star-cell::after { content: "★"; font-size: 14px; color: #ca8a04; }

    /* కాయిన్స్ */
    .token {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      position: absolute;
      border: 2.5px solid white;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      z-index: 10;
      transition: all 0.25s ease;
    }
    .token.red { background: #dc2626; }
    .token.blue { background: #2563eb; }

    /* డైస్ కంట్రోల్స్ */
    .btn-dice {
      background: #fbbf24;
      color: black;
      font-size: 17px;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      margin: 10px 0;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
    }

    /* విన్నర్ యానిమేషన్ */
    #winner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .trophy-icon {
      font-size: 90px;
      animation: popUp 0.8s ease infinite alternate;
    }
    @keyframes popUp {
      0% { transform: scale(0.8) translateY(0); }
      100% { transform: scale(1.15) translateY(-15px); }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>DILIP MUDIRAJ | REAL LUDO</header>

  <div class="container">

    <!-- రూమ్ లాబీ -->
    <div class="lobby-card" id="lobby">
      <h3 style="color:#ef4444; font-size:16px; margin-bottom:10px;">🎲 Real 2-Player Ludo Board</h3>
      <input type="text" id="custom-room" placeholder="రూమ్ కోడ్ (ఉదా: 111)">
      <div class="btn-group">
        <button class="btn btn-host" onclick="startAsHost()">Player 1 (Red)</button>
        <button class="btn btn-join" onclick="startAsJoin()">Player 2 (Blue)</button>
      </div>
      <div id="status-msg" style="font-size: 12px; color: #94a3b8; margin-top: 8px;">ఒకే కోడ్ కొట్టి ఇద్దరూ జాయిన్ అవ్వండి</div>
    </div>

    <!-- గేమ్ ప్లే -->
    <div id="game-play" style="display:none; text-align:center;">
      <div id="turn-banner" style="font-size: 14px; font-weight: bold; color: #38bdf8; margin-bottom: 6px;">మ్యాచ్ ప్రారంభమైంది!</div>
      <button class="btn btn-dice" id="dice-btn" onclick="roll()">🎲 Roll Dice: <span id="dice-val">-</span></button>
      
      <!-- రియల్ లూడో బోర్డు -->
      <div class="ludo-container" id="ludoBoard">
        <!-- 4 మూలల హోమ్ బాక్స్‌లు -->
        <div class="home-box home-red"><div class="inner-base">🔴 RED</div></div>
        <div class="home-box home-green"><div class="inner-base">🟢</div></div>
        <div class="home-box home-yellow"><div class="inner-base">🟡</div></div>
        <div class="home-box home-blue"><div class="inner-base">🔵 BLUE</div></div>
        
        <!-- సెంటర్ ట్రయాంగిల్ / హోమ్ -->
        <div class="center-home">🏆</div>
      </div>
    </div>

  </div>

  <!-- విన్నర్ ట్రోఫీ పాప్-అప్ -->
  <div id="winner-modal">
    <div class="trophy-icon">🏆</div>
    <div style="font-size:26px; font-weight:bold; color:#fbbf24; margin-top:15px;" id="winner-text">YOU WON!</div>
    <button class="btn" style="background:#38bdf8; margin-top:20px; color:black;" onclick="location.reload()">మళ్లీ ఆడండి</button>
  </div>

  <script>
    // లూడో బోర్డు చుట్టూ తిరిగే రియల్ పాత్ కోఆర్డినేట్స్ (Grid: 11x11)
    const PATH = [
      {r:5, c:1}, {r:5, c:2}, {r:5, c:3}, {r:5, c:4}, 
      {r:4, c:5}, {r:3, c:5}, {r:2, c:5}, {r:1, c:5}, {r:1, c:6}, {r:1, c:7},
      {r:2, c:7}, {r:3, c:7}, {r:4, c:7}, {r:5, c:8}, {r:5, c:9}, {r:5, c:10}, {r:5, c:11},
      {r:6, c:11}, {r:7, c:11}, {r:7, c:10}, {r:7, c:9}, {r:7, c:8},
      {r:8, c:7}, {r:9, c:7}, {r:10, c:7}, {r:11, c:7}, {r:11, c:6}, {r:11, c:5},
      {r:10, c:5}, {r:9, c:5}, {r:8, c:5}, {r:7, c:4}, {r:7, c:3}, {r:7, c:2}, {r:7, c:1},
      {r:6, c:1}, // సెంటర్ హోమ్ ఎంట్రీ
      {r:6, c:2}, {r:6, c:3}, {r:6, c:4}, {r:6, c:5} // WIN గడి
    ];

    const SAFE_SPOTS = [0, 8, 17, 26]; // స్టార్ సేఫ్ జోన్లు
    const TOTAL_STEPS = PATH.length - 1;

    let peer = null, conn = null, myColor = '', currentTurn = 'red';
    let positions = { red: 0, blue: 17 }; // రెడ్ ఒకవైపు, బ్లూ ఇంకోవైపు స్టార్ట్ అవుతాయి

    // గడులను క్రియేట్ చేయడం
    const boardEl = document.getElementById('ludoBoard');
    PATH.forEach((pt, idx) => {
      const cell = document.createElement('div');
      cell.className = 'l-cell';
      cell.style.gridRow = pt.r;
      cell.style.gridColumn = pt.c;
      cell.id = 'cell-' + pt.r + '-' + pt.c;

      if (SAFE_SPOTS.includes(idx)) cell.classList.add('star-cell');
      if (idx === TOTAL_STEPS) cell.style.background = "#86efac";
      boardEl.appendChild(cell);
    });

    function startAsHost() {
      const code = document.getElementById('custom-room').value.trim();
      if(!code) return alert("కోడ్ ఇవ్వండి!");
      peer = new Peer('dilip-real-ludo-' + code);
      myColor = 'red';

      peer.on('open', () => {
        document.getElementById('status-msg').innerText = `రూమ్ ${code} రెడీ! ఫ్రెండ్‌ను జాయిన్ అవ్వమనండి.`;
      });
      peer.on('connection', (c) => {
        conn = c;
        initGame("ఫ్రెండ్ జాయిన్ అయ్యారు! మీరు RED (ఫస్ట్ టర్న్).");
      });
      peer.on('error', () => alert("ఈ కోడ్ ఇప్పటికే వాడకంలో ఉంది. వేరే కోడ్ వాడండి."));
    }

    function startAsJoin() {
      const code = document.getElementById('custom-room').value.trim();
      if(!code) return alert("కోడ్ ఇవ్వండి!");
      peer = new Peer();
      myColor = 'blue';

      peer.on('open', () => {
        conn = peer.connect('dilip-real-ludo-' + code);
        initGame("రూమ్‌లో జాయిన్ అయ్యారు! మీరు BLUE.");
      });
    }

    function initGame(msg) {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game-play').style.display = 'block';
      document.getElementById('turn-banner').innerText = msg;
      render();

      conn.on('data', (data) => {
        if(data.type === 'move') {
          positions = data.positions;
          currentTurn = data.nextTurn;
          document.getElementById('dice-val').innerText = data.dice;
          render();
          if (data.alertMsg) alert(data.alertMsg);
          if (data.winner) showWin(data.winner);
        }
      });
    }

    function roll() {
      if (currentTurn !== myColor) return alert("ఇది మీ టర్న్ కాదు!");

      const rollVal = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice-val').innerText = rollVal;

      let pos = positions[myColor];
      let alertMsg = null;

      if (pos + rollVal <= TOTAL_STEPS) {
        pos += rollVal;

        // కట్ రూల్ (సేఫ్ స్టార్ జోన్ కాకపోతే ప్రత్యర్థి కట్ అవుతారు)
        const opponent = myColor === 'red' ? 'blue' : 'red';
        if (!SAFE_SPOTS.includes(pos) && pos === positions[opponent] && pos !== TOTAL_STEPS) {
          positions[opponent] = (opponent === 'red') ? 0 : 17; // ప్రారంభ స్థానానికి పడిపోతారు
          alertMsg = "⚔️ కాయిన్ కట్! ప్రత్యర్థి మొదటి స్థానానికి పడిపోయారు!";
        }

        positions[myColor] = pos;
      } else {
        alertMsg = "ఎక్కువ పడింది! సరిగ్గా సరిపోయే నంబర్ కావాలి.";
      }

      let winner = (positions[myColor] === TOTAL_STEPS) ? myColor : null;
      const next = myColor === 'red' ? 'blue' : 'red';
      currentTurn = next;
      render();

      if (alertMsg) alert(alertMsg);

      if (conn && conn.open) {
        conn.send({
          type: 'move',
          dice: rollVal,
          positions: positions,
          nextTurn: next,
          winner: winner,
          alertMsg: alertMsg
        });
      }

      if (winner) showWin(winner);
    }

    function render() {
      document.querySelectorAll('.token').forEach(t => t.remove());

      // రెడ్ కాయిన్
      const rPt = PATH[positions.red];
      const rCell = document.getElementById(`cell-${rPt.r}-${rPt.c}`);
      if (rCell) {
        const t = document.createElement('div');
        t.className = 'token red';
        rCell.appendChild(t);
      }

      // బ్లూ కాయిన్
      const bPt = PATH[positions.blue];
      const bCell = document.getElementById(`cell-${bPt.r}-${bPt.c}`);
      if (bCell) {
        const t = document.createElement('div');
        t.className = 'token blue';
        bCell.appendChild(t);
      }

      document.getElementById('turn-banner').innerText = `టర్న్: ${currentTurn.toUpperCase()} ${currentTurn === myColor ? '(మీరు ఆడండి)' : '(ఫ్రెండ్ టర్న్)'}`;
    }

    function showWin(w) {
      document.getElementById('winner-modal').style.display = 'flex';
      document.getElementById('winner-text').innerHTML = (w === myColor) ? "🏆 అద్భుతం!<br>మీరే విన్నర్!" : `🏆 ${w.toUpperCase()} గెలిచారు!`;
      confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
