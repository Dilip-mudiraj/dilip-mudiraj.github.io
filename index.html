<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilip Mudiraj | Official Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: #0b0f19; 
      color: #f8fafc; 
      padding-bottom: 80px; 
      user-select: none; 
      -webkit-user-select: none; 
    }

    /* Top Navigation */
    header {
      background: #111827;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 17px; font-weight: bold; color: #38bdf8; letter-spacing: 0.5px; }
    .owner-btn {
      background: #1f2937;
      color: #94a3b8;
      border: 1px solid #374151;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .container { max-width: 480px; margin: 20px auto; padding: 0 15px; }

    /* Instagram Banner */
    .profile-card {
      background: #111827;
      border-radius: 14px;
      padding: 22px 18px;
      text-align: center;
      margin-bottom: 22px;
      border: 1px solid #1f2937;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .profile-card h2 { font-size: 22px; margin-bottom: 6px; color: #fff; }
    .profile-card p { color: #9ca3af; font-size: 13px; margin-bottom: 18px; }
    .insta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(220, 39, 67, 0.35);
    }

    /* Secret Post Box (Only visible to Owner after login) */
    #admin-panel {
      display: none;
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 2px solid #38bdf8;
    }
    #admin-panel h3 { font-size: 14px; margin-bottom: 10px; color: #38bdf8; }
    textarea {
      width: 100%;
      height: 75px;
      padding: 10px;
      background: #0b0f19;
      border: 1px solid #374151;
      border-radius: 8px;
      color: white;
      margin-bottom: 10px;
      outline: none;
      font-size: 13px;
    }
    .file-input { margin-bottom: 12px; font-size: 12px; color: #9ca3af; width: 100%; }
    .publish-btn {
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      color: #0b0f19;
      font-weight: bold;
      cursor: pointer;
    }

    /* Feed Posts */
    .feed-heading { font-size: 15px; color: #94a3b8; margin-bottom: 12px; font-weight: 600; }
    .post-card {
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid #1f2937;
      position: relative;
    }

    /* Media Anti-Download Protection */
    .media-box {
      position: relative;
      width: 100%;
      background: #000;
    }
    .post-card img, .post-card video {
      width: 100%;
      display: block;
      max-height: 450px;
      object-fit: cover;
      pointer-events: auto;
      -webkit-touch-callout: none; /* లాంగ్ ప్రెస్ చేస్తే సేవ్ రాకుండా */
    }

    .post-footer {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .post-text { font-size: 14px; line-height: 1.5; color: #e5e7eb; flex: 1; }

    /* Delete Button (Only for Admin) */
    .delete-btn {
      display: none;
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- HEADER -->
  <header>
    <div class="brand">DILIP MUDIRAJ</div>
    <button class="owner-btn" onclick="openOwnerPanel()">Admin Login</button>
  </header>

  <div class="container">

    <!-- INSTAGRAM SECTION -->
    <div class="profile-card">
      <h2>Dilip Mudiraj</h2>
      <p>Welcome to my official portfolio. Check out my Instagram below:</p>
      <a href="https://www.instagram.com/dilip_mudiraj_ns_lover" target="_blank" class="insta-button">
        📸 Visit My Instagram Profile
      </a>
    </div>

    <!-- SECRET OWNER DESK (Only visible to you) -->
    <div id="admin-panel">
      <h3>Owner Only: Upload Photo / Video</h3>
      <textarea id="captionText" placeholder="వివరణ లేదా క్యాప్షన్ రాయండి..."></textarea>
      <input type="file" id="mediaUpload" accept="image/*,video/*" class="file-input">
      <button class="publish-btn" onclick="publishPost()">Post to Website</button>
    </div>

    <!-- PUBLIC POSTS FEED -->
    <div class="feed-heading">Gallery & Updates</div>
    <div id="posts-container">
      
      <!-- మొదటి డిఫాల్ట్ పోస్ట్ -->
      <div class="post-card">
        <div class="media-box">
          <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600" alt="Official Photo" oncontextmenu="return false;">
        </div>
        <div class="post-footer">
          <div class="post-text">నా అఫీషియల్ వెబ్‌సైట్‌కి స్వాగతం! మరిన్ని ఫోటోలు మరియు వీడియోల కోసం పైన ఉన్న బటన్ ద్వారా నా Instagram పేజీని చూడండి.</div>
          <button class="delete-btn" onclick="deletePost(this)">Delete</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    let isOwnerLoggedIn = false;

    // మీ కొత్త సీక్రెట్ పాస్‌వర్డ్: 3386
    function openOwnerPanel() {
      const pin = prompt("యజమాని పాస్‌వర్డ్ (Owner Password) ఎంటర్ చేయండి:");
      if (pin === "3386") {
        isOwnerLoggedIn = true;
        document.getElementById('admin-panel').style.display = 'block';
        
        // లాగిన్ అయ్యాక మాత్రమే డిలీట్ బటన్లు కనిపిస్తాయి
        const delBtns = document.querySelectorAll('.delete-btn');
        delBtns.forEach(btn => btn.style.display = 'block');

        alert("లాగిన్ విజయవంతమైంది! మీరు కొత్త ఫోటోలు/వీడియోలు పెట్టవచ్చు, అక్కర్లేనివి డిలీట్ చేయవచ్చు.");
      } else if (pin !== null) {
        alert("తప్పు పాస్‌వర్డ్! సందర్శకులకు అప్‌లోడ్ లేదా డిలీట్ చేసే అనుమతి లేదు.");
      }
    }

    function publishPost() {
      const text = document.getElementById('captionText').value;
      const fileInput = document.getElementById('mediaUpload');
      const postsArea = document.getElementById('posts-container');

      if (!text && fileInput.files.length === 0) {
        alert("దయచేసి ఏదైనా రాయండి లేదా ఫోటో/వీడియో సెలెక్ట్ చేయండి!");
        return;
      }

      const postBox = document.createElement('div');
      postBox.className = 'post-card';

      let mediaContent = '';
      if (fileInput.files.length > 0) {
        const selectedFile = fileInput.files[0];
        const mediaUrl = URL.createObjectURL(selectedFile);
        
        // వీడియోలకి డౌన్‌లోడ్ ఆప్షన్ లేకుండా లాక్ (controlsList="nodownload")
        if (selectedFile.type.startsWith('video/')) {
          mediaContent = `
            <div class="media-box">
              <video src="${mediaUrl}" controls controlsList="nodownload" oncontextmenu="return false;"></video>
            </div>`;
        } else {
          mediaContent = `
            <div class="media-box">
              <img src="${mediaUrl}" oncontextmenu="return false;">
            </div>`;
        }
      }

      const displayStyle = isOwnerLoggedIn ? 'block' : 'none';

      postBox.innerHTML = `
        ${mediaContent}
        <div class="post-footer">
          <div class="post-text">${text}</div>
          <button class="delete-btn" style="display: ${displayStyle};" onclick="deletePost(this)">Delete</button>
        </div>
      `;

      postsArea.insertBefore(postBox, postsArea.firstChild);

      document.getElementById('captionText').value = '';
      fileInput.value = '';
      alert("పోస్ట్ విజయవంతంగా యాడ్ అయింది!");
    }

    function deletePost(button) {
      if (confirm("ఈ పోస్ట్‌ను డిలీట్ చేయాలనుకుంటున్నారా?")) {
        const postCard = button.closest('.post-card');
        postCard.remove();
        alert("పోస్ట్ తొలగించబడింది!");
      }
    }

    // ఎవరూ రైట్ క్లిక్ లేదా లాంగ్ ప్రెస్ చేయకుండా లాక్ చేయడం
    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>

</body>
</html>
