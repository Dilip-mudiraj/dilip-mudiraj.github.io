<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilip Mudiraj | Real Ludo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; text-align: center; padding-bottom: 30px; user-select: none; }
    header { background: #111827; padding: 12px; font-size: 18px; font-weight: bold; color: #38bdf8; border-bottom: 1px solid #1f2937; }
    .container { max-width: 380px; margin: 10px auto; padding: 0 10px; }

    /* డైస్ సెక్షన్ */
    .dice-box { margin: 15px 0; }
    .dice-btn {
      background: #fbbf24; color: #000; font-size: 20px; font-weight: bold;
      border: none; padding: 12px 28px; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
    }
    #turn-txt { font-size: 16px; font-weight: bold; color: #ef4444; margin-bottom: 8px; }

    /* లూడో బోర్డు */
    .board {
      width: 100%; max-width: 340px; aspect-ratio: 1; margin: 0 auto;
      background: #fff; border: 4px solid #1e293b; border-radius: 8px;
      display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr);
    }
    .cell { border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; position: relative; background: #f8fafc; }
    
    .home { grid-column: span 4; grid-row: span 4; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 6px; align-items: center; justify-items: center; }
    .home-red { grid-column: 1 / 5; grid-row: 1 / 5; background: #ef4444; }
    .home-blue { grid-column: 8 / 12; grid-row: 8 / 12; background: #3b82f6; }
    .home-green { grid-column: 8 / 12; grid-row: 1 / 5; background: #16a34a; }
    .home-yellow { grid-column: 1 / 5; grid-row: 8 / 12; background: #ca8a04; }

    .pocket { width: 24px; height: 24px; background: white; border-radius: 50%; border: 2px solid #000; display: flex; align-items: center; justify-content: center; }
    .center-home { grid-column: 5 / 8; grid-row: 5 / 8; background: #0f172a; color: #fbbf24; font-size: 20px; display: flex; align-items: center; justify-content: center; border: 2px solid #fbbf24; font-weight: bold; }
    .star { background: #fef08a !important; }
    .star::after { content: "★"; color: #ca8a04; font-size: 14px; }

    /* కాయిన్స్ */
    .token { width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
    .token.red { background: #dc2626; }
    .token.blue { background: #2563eb; }
    .clickable { outline: 3px solid #fbbf24; animation: pulse 0.5s infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.3); } }
  </style>
</head>
<body>

  <header>DILIP MUDIRAJ | REAL LUDO</header>

  <div class="container">
    <div class="dice-box">
      <div id="turn-txt">🔴 RED టర్న్ - డైస్ వేయండి</div>
      <button class="dice-btn" id="rollBtn" onclick="roll()">🎲 Roll Dice: <span id="diceVal">-</span></button>
      <div id="msg" style="color:#38bdf8; font-size:13px; margin-top:6px; min-height:18px;"></div>
    </div>

    <div class="board" id="ludoBoard">
      <div class="home home-red">
        <div class="pocket" id="rp-0"></div><div class="pocket" id="rp-1"></div>
        <div class="pocket" id="rp-2"></div><div class="pocket" id="rp-3"></div>
      </div>
      <div class="home home-green"></div>
      <div class="home home-yellow"></div>
      <div class="home home-blue">
        <div class="pocket" id="bp-0"></div><div class="pocket" id="bp-1"></div>
        <div class="pocket" id="bp-2"></div><div class="pocket" id="bp-3"></div>
      </div>
      <div class="center-home">🏆</div>
    </div>
  </div>

  <script>
    // బోర్డు గడుల మ్యాప్
    const PATH = [
      {r:5, c:1}, {r:5, c:2}, {r:5, c:3}, {r:5, c:4}, {r:4, c:5}, {r:3, c:5}, {r:2, c:5}, {r:1, c:5},
      {r:1, c:6}, {r:1, c:7}, {r:2, c:7}, {r:3, c:7}, {r:4, c:7}, {r:5, c:8}, {r:5, c:9}, {r:5, c:10},
      {r:5, c:11}, {r:6, c:11}, {r:7, c:11}, {r:7, c:10}, {r:7, c:9}, {r:7, c:8}, {r:8, c:7}, {r:9, c:7},
      {r:10, c:7}, {r:11, c:7}, {r:11, c:6}, {r:11, c:5}, {r:10, c:5}, {r:9, c:5}, {r:8, c:5}, {r:7, c:4},
      {r:7, c:3}, {r:7, c:2}, {r:7, c:1}, {r:6, c:1}, {r:6, c:2}, {r:6, c:3}, {r:6, c:4}, {r:6, c:5}
    ];

    const SAFE = [0, 8, 17, 26];
    const WIN = PATH.length - 1;
    let turn = 'red';
    let dice = 0;
    let selecting = false;

    let tokens = {
      red: [-1, -1, -1, -1],
      blue: [-1, -1, -1, -1]
    };

    // బోర్డు తయారీ
    const b = document.getElementById('ludoBoard');
    PATH.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'cell';
      el.style.gridRow = p.r;
      el.style.gridColumn = p.c;
      el.id = 'c-' + p.r + '-' + p.c;
      if (SAFE.includes(i)) el.classList.add('star');
      if (i === WIN) el.style.background = '#86efac';
      b.appendChild(el);
    });

    render();

    function roll() {
      if (selecting) return;
      dice = Math.floor(Math.random() * 6) + 1;
      document.getElementById('diceVal').innerText = dice;

      let toks = tokens[turn];
      let movable = [];
      toks.forEach((p, idx) => {
        if (p === -1 && dice === 6) movable.push(idx);
        else if (p !== -1 && p + dice <= WIN) movable.push(idx);
      });

      if (movable.length === 0) {
        document.getElementById('msg').innerText = "కదిలే కాయిన్ లేదు!";
        setTimeout(nextTurn, 700);
      } else if (movable.length === 1 && toks[movable[0]] === -1 && dice === 6) {
        move(movable[0]);
      } else {
        selecting = true;
        document.getElementById('msg').innerText = "బోర్డుపై కాయిన్ టచ్ చేయండి";
        movable.forEach(idx => {
          document.getElementById('t-' + turn + '-' + idx).classList.add('clickable');
        });
      }
    }

    function clickToken(col, idx) {
      if (!selecting || col !== turn) return;
      selecting = false;
      move(idx);
    }

    function move(idx) {
      let p = tokens[turn][idx];
      if (p === -1 && dice === 6) {
        tokens[turn][idx] = (turn === 'red') ? 0 : 17;
      } else {
        tokens[turn][idx] += dice;
        let np = tokens[turn][idx];
        let opp = turn === 'red' ? 'blue' : 'red';
        if (!SAFE.includes(np) && np !== WIN) {
          tokens[opp].forEach((op, oi) => {
            if (op === np) {
              tokens[opp][oi] = -1;
              alert("⚔️ ప్రత్యర్థి కాయిన్ కట్ అయింది!");
            }
          });
        }
      }

      if (tokens[turn].every(x => x === WIN)) {
        alert("🏆 " + turn.toUpperCase() + " గెలిచారు!");
        location.reload();
        return;
      }

      if (dice !== 6) nextTurn();
      else {
        document.getElementById('msg').innerText = "6 పడింది! ఇంకో ఛాన్స్ వచ్చింది!";
        render();
      }
    }

    function nextTurn() {
      turn = turn === 'red' ? 'blue' : 'red';
      selecting = false;
      document.getElementById('msg').innerText = "";
      const tTxt = document.getElementById('turn-txt');
      tTxt.innerText = (turn === 'red' ? "🔴 RED" : "🔵 BLUE") + " టర్న్ - డైస్ వేయండి";
      tTxt.style.color = turn === 'red' ? '#ef4444' : '#3b82f6';
      render();
    }

    function render() {
      document.querySelectorAll('.token').forEach(e => e.remove());
      ['red', 'blue'].forEach(col => {
        tokens[col].forEach((p, idx) => {
          const t = document.createElement('div');
          t.className = 'token ' + col;
          t.id = 't-' + col + '-' + idx;
          t.onclick = () => clickToken(col, idx);
          if (p === -1) {
            document.getElementById((col === 'red' ? 'rp-' : 'bp-') + idx).appendChild(t);
          } else if (p < WIN) {
            const pt = PATH[p];
            document.getElementById('c-' + pt.r + '-' + pt.c).appendChild(t);
          }
        });
      });
    }
  </script>
</body>
</html>
