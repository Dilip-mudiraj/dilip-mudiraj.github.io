<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilip Mudiraj | Official Site</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0b0f19; color: #f8fafc; padding-bottom: 70px; }

    /* Top Bar */
    header {
      background: #111827;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 17px; font-weight: bold; color: #38bdf8; letter-spacing: 0.5px; }
    .owner-btn {
      background: #1f2937;
      color: #94a3b8;
      border: 1px solid #374151;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .container { max-width: 480px; margin: 20px auto; padding: 0 15px; }

    /* Instagram Banner Card */
    .profile-card {
      background: #111827;
      border-radius: 14px;
      padding: 22px 18px;
      text-align: center;
      margin-bottom: 22px;
      border: 1px solid #1f2937;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .profile-card h2 { font-size: 22px; margin-bottom: 6px; color: #fff; }
    .profile-card p { color: #9ca3af; font-size: 13px; margin-bottom: 18px; }
    .insta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(220, 39, 67, 0.35);
    }

    /* Secret Post Box (Only Owner) */
    #admin-panel {
      display: none;
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 2px solid #38bdf8;
    }
    #admin-panel h3 { font-size: 14px; margin-bottom: 10px; color: #38bdf8; }
    textarea {
      width: 100%;
      height: 75px;
      padding: 10px;
      background: #0b0f19;
      border: 1px solid #374151;
      border-radius: 8px;
      color: white;
      margin-bottom: 10px;
      outline: none;
      font-size: 13px;
    }
    .file-input { margin-bottom: 12px; font-size: 12px; color: #9ca3af; width: 100%; }
    .publish-btn {
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      color: #0b0f19;
      font-weight: bold;
      cursor: pointer;
    }

    /* Posts Feed */
    .feed-heading { font-size: 15px; color: #94a3b8; margin-bottom: 12px; font-weight: 600; }
    .post-card {
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid #1f2937;
      position: relative;
    }
    .post-card img, .post-card video { width: 100%; display: block; max-height: 450px; object-fit: cover; }
    .post-footer {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .post-text { font-size: 14px; line-height: 1.5; color: #e5e7eb; flex: 1; }
    
    /* Delete Button (కేవలం అడ్మిన్ లాగిన్ అయినప్పుడే కనిపిస్తుంది) */
    .delete-btn {
      display: none;
      background: #ef4444;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">DILIP MUDIRAJ</div>
    <button class="owner-btn" onclick="openOwnerPanel()">Admin Login</button>
  </header>

  <div class="container">

    <!-- INSTAGRAM MAIN SECTION -->
    <div class="profile-card">
      <h2>Dilip Mudiraj</h2>
      <p>Welcome to my official space. Visit my Instagram below:</p>
      <a href="https://www.instagram.com/dilip_mudiraj_ns_lover" target="_blank" class="insta-button">
        📸 View My Instagram Profile
      </a>
    </div>

    <!-- SECRET ADMIN DESK (మీరు పాస్‌వర్డ్ ఇస్తేనే ఓపెన్ అవుతుంది) -->
    <div id="admin-panel">
      <h3>Owner Secret Desk: Add New Post</h3>
      <textarea id="captionText" placeholder="మీరు రాయాలనుకుంటున్న విషయం ఇక్కడ టైప్ చేయండి..."></textarea>
      <input type="file" id="mediaUpload" accept="image/*,video/*" class="file-input">
      <button class="publish-btn" onclick="publishPost()">Post Now</button>
    </div>

    <!-- PUBLIC POSTS (అందరూ చూసే పోస్టులు) -->
    <div class="feed-heading">Recent Updates & Gallery</div>
    <div id="posts-container">
      
      <!-- మొదటి డిఫాల్ట్ పోస్ట్ -->
      <div class="post-card">
        <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600" alt="Post photo">
        <div class="post-footer">
          <div class="post-text">నా అఫీషియల్ వెబ్‌సైట్‌కి స్వాగతం! నా తాజా ఫోటోలు, వీడియోల కోసం పైన ఉన్న బటన్ ద్వారా నా Instagram పేజీని చూడండి.</div>
          <button class="delete-btn" onclick="deletePost(this)">Delete</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    let isOwnerLoggedIn = false;

    // కేవలం మీ కోసం మాత్రమే పాస్‌వర్డ్ (1234)
    function openOwnerPanel() {
      const pin = prompt("యజమాని పాస్‌వర్డ్ (Owner Password) ఎంటర్ చేయండి:");
      if (pin === "1234") {
        isOwnerLoggedIn = true;
        document.getElementById('admin-panel').style.display = 'block';
        
        // అన్ని పోస్టుల కింద Delete బటన్లు కనిపించేలా చేయడం
        const delBtns = document.querySelectorAll('.delete-btn');
        delBtns.forEach(btn => btn.style.display = 'block');

        alert("లాగిన్ అయ్యారు! మీరు పోస్ట్ చేయవచ్చు మరియు అక్కర్లేని పోస్ట్‌లను 'Delete' బటన్ నొక్కి తీసివేయవచ్చు.");
      } else if (pin !== null) {
        alert("తప్పు పాస్‌వర్డ్! సందర్శకులకు ఈ అనుమతి లేదు.");
      }
    }

    function publishPost() {
      const text = document.getElementById('captionText').value;
      const fileInput = document.getElementById('mediaUpload');
      const postsArea = document.getElementById('posts-container');

      if (!text && fileInput.files.length === 0) {
        alert("దయచేసి ఏదైనా రాయండి లేదా ఫోటో/వీడియో సెలెక్ట్ చేయండి!");
        return;
      }

      const postBox = document.createElement('div');
      postBox.className = 'post-card';

      let mediaContent = '';
      if (fileInput.files.length > 0) {
        const selectedFile = fileInput.files[0];
        const mediaUrl = URL.createObjectURL(selectedFile);
        if (selectedFile.type.startsWith('video/')) {
          mediaContent = `<video src="${mediaUrl}" controls></video>`;
        } else {
          mediaContent = `<img src="${mediaUrl}">`;
        }
      }

      // లాగిన్ అయి ఉన్నారు కాబట్టి కొత్త పోస్ట్‌కి డిలీట్ బటన్ ఆటోమేటిక్‌గా వస్తుంది
      const displayStyle = isOwnerLoggedIn ? 'block' : 'none';

      postBox.innerHTML = `
        ${mediaContent}
        <div class="post-footer">
          <div class="post-text">${text}</div>
          <button class="delete-btn" style="display: ${displayStyle};" onclick="deletePost(this)">Delete</button>
        </div>
      `;

      postsArea.insertBefore(postBox, postsArea.firstChild);

      document.getElementById('captionText').value = '';
      fileInput.value = '';
      alert("పోస్ట్ విజయవంతంగా యాడ్ అయింది!");
    }

    // పోస్ట్‌ను పూర్తిగా తొలగించే ఫంక్షన్
    function deletePost(button) {
      const confirmDelete = confirm("ఈ పోస్ట్‌ను నిజంగానే డిలీట్ చేయాలనుకుంటున్నారా?");
      if (confirmDelete) {
        const postCard = button.closest('.post-card');
        postCard.remove();
        alert("పోస్ట్ పూర్తిగా తొలగించబడింది!");
      }
    }
  </script>

</body>
</html>
