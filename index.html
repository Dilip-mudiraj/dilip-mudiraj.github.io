<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilip Mudiraj | 3D Ludo Arena</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: #0b0f19; 
      color: #f8fafc; 
      padding-bottom: 60px; 
      user-select: none; 
      -webkit-user-select: none; 
      overflow-x: hidden;
    }

    header {
      background: #111827;
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #1f2937;
      font-size: 17px;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .container { max-width: 440px; margin: 15px auto; padding: 0 10px; }

    .lobby-card {
      background: #111827;
      border-radius: 12px;
      padding: 14px;
      border: 2px solid #ef4444;
      text-align: center;
      margin-bottom: 15px;
    }
    input {
      width: 75%;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #ef4444;
      background: #0b0f19;
      color: #ef4444;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      outline: none;
    }
    .btn-group { display: flex; gap: 8px; justify-content: center; }
    .btn {
      padding: 9px 15px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-host { background: #ef4444; color: white; }
    .btn-join { background: #3b82f6; color: white; }

    /* --- 3D DICE STYLES --- */
    .dice-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0 15px;
      perspective: 600px;
    }
    .dice-scene {
      width: 60px;
      height: 60px;
      cursor: pointer;
    }
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-30px);
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1.2);
    }
    .cube-face {
      position: absolute;
      width: 60px;
      height: 60px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      display: grid;
      padding: 6px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #0f172a;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
    }
    .dot.red-dot { background: #dc2626; width: 14px; height: 14px; }

    /* డైస్ ఫేస్ స్థానాలు */
    .face-1 { transform: rotateY(0deg) translateZ(30px); display: flex; align-items: center; justify-content: center; }
    .face-6 { transform: rotateY(180deg) translateZ(30px); grid-template-columns: 1fr 1fr; }
    .face-2 { transform: rotateY(90deg) translateZ(30px); grid-template-columns: 1fr 1fr; }
    .face-2 .dot:nth-child(2) { grid-column: 2; align-self: flex-end; }
    .face-5 { transform: rotateY(-90deg) translateZ(30px); grid-template-columns: 1fr 1fr; }
    .face-5 .dot:nth-child(3) { grid-column: span 2; }
    .face-3 { transform: rotateX(90deg) translateZ(30px); grid-template-columns: 1fr 1fr 1fr; }
    .face-3 .dot:nth-child(2) { align-self: center; }
    .face-3 .dot:nth-child(3) { align-self: flex-end; }
    .face-4 { transform: rotateX(-90deg) translateZ(30px); grid-template-columns: 1fr 1fr; }

    /* లూడో బోర్డు (11x11 Grid) */
    .ludo-container {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1;
      margin: 5px auto;
      background: #ffffff;
      border: 4px solid #1e293b;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(11, 1fr);
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      position: relative;
    }

    .l-cell {
      border: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #f8fafc;
    }

    .home-box {
      grid-column: span 4;
      grid-row: span 4;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px;
      align-items: center;
      justify-items: center;
    }
    .home-red { grid-column: 1 / 5; grid-row: 1 / 5; background: #ef4444; }
    .home-blue { grid-column: 8 / 12; grid-row: 8 / 12; background: #3b82f6; }
    .home-green { grid-column: 8 / 12; grid-row: 1 / 5; background: #16a34a; }
    .home-yellow { grid-column: 1 / 5; grid-row: 8 / 12; background: #ca8a04; }

    .pocket {
      width: 28px;
      height: 28px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #0f172a;
    }

    .center-home {
      grid-column: 5 / 8;
      grid-row: 5 / 8;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fbbf24;
      font-size: 15px;
      border: 2px solid #fbbf24;
      font-weight: bold;
    }

    .star-cell { background: #fef08a !important; }
    .star-cell::after { content: "★"; font-size: 15px; color: #ca8a04; }

    /* కాయిన్స్ & మూవ్ ఎఫెక్ట్స్ */
    .token {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
      cursor: pointer;
      display: inline-block;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .token.red { background: #dc2626; }
    .token.blue { background: #2563eb; }
    .token.clickable {
      animation: bounce 0.6s infinite alternate;
      outline: 3px solid #fbbf24;
    }
    @keyframes bounce {
      from { transform: scale(1); }
      to { transform: scale(1.3); }
    }

    /* విన్నర్ మోడల్ */
    #winner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .trophy-icon {
      font-size: 90px;
      animation: popUp 0.8s ease infinite alternate;
    }
    @keyframes popUp {
      0% { transform: scale(0.8) translateY(0); }
      100% { transform: scale(1.15) translateY(-15px); }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>DILIP MUDIRAJ | 3D SOUND LUDO</header>

  <div class="container">

    <div class="lobby-card" id="lobby">
      <h3 style="color:#ef4444; font-size:16px; margin-bottom:10px;">🎲 3D Real 4-Token Ludo</h3>
      <input type="text" id="custom-room" placeholder="రూమ్ కోడ్ (ఉదా: 111)">
      <div class="btn-group">
        <button class="btn btn-host" onclick="startAsHost()">Player 1 (Red 4 কాయిన్స్)</button>
        <button class="btn btn-join" onclick="startAsJoin()">Player 2 (Blue 4 কాయిన్స్)</button>
      </div>
      <div id="status-msg" style="font-size: 12px; color: #94a3b8; margin-top: 8px;">రూమ్ కోడ్ కొట్టి జాయిన్ అవ్వండి</div>
    </div>

    <div id="game-play" style="display:none; text-align:center;">
      <div id="turn-banner" style="font-size: 14px; font-weight: bold; color: #38bdf8; margin-bottom: 4px;">మ్యాచ్ ప్రారంభమైంది!</div>
      
      <!-- 3D DICE HTML -->
      <div class="dice-area">
        <div class="dice-scene" onclick="roll()">
          <div class="cube" id="diceCube">
            <div class="cube-face face-1"><div class="dot red-dot"></div></div>
            <div class="cube-face face-6">
              <div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div>
            </div>
            <div class="cube-face face-2"><div class="dot"></div><div class="dot"></div></div>
            <div class="cube-face face-5">
              <div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="cube-face face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="cube-face face-4">
              <div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div>
            </div>
          </div>
        </div>
        <small style="color:#94a3b8; font-size:11px; margin-top:6px;">డైస్ మీద టచ్ చేసి రోల్ చేయండి</small>
      </div>

      <!-- లూడో బోర్డు -->
      <div class="ludo-container" id="ludoBoard">
        <div class="home-box home-red">
          <div class="pocket" id="r-pocket-0"></div>
          <div class="pocket" id="r-pocket-1"></div>
          <div class="pocket" id="r-pocket-2"></div>
          <div class="pocket" id="r-pocket-3"></div>
        </div>
        <div class="home-box home-green"></div>
        <div class="home-box home-yellow"></div>
        
        <div class="home-box home-blue">
          <div class="pocket" id="b-pocket-0"></div>
          <div class="pocket" id="b-pocket-1"></div>
          <div class="pocket" id="b-pocket-2"></div>
          <div class="pocket" id="b-pocket-3"></div>
        </div>
        
        <div class="center-home">
          🏆 HOME
          <div style="font-size:10px; margin-top:3px;" id="home-count">R:0 | B:0</div>
        </div>
      </div>
    </div>

  </div>

  <!-- విన్నర్ యానిమేషన్ -->
  <div id="winner-modal">
    <div class="trophy-icon">🏆</div>
    <div style="font-size:26px; font-weight:bold; color:#fbbf24; margin-top:15px;" id="winner-text">YOU WON!</div>
    <button class="btn" style="background:#38bdf8; margin-top:20px; color:black;" onclick="location.reload()">మళ్లీ ఆడండి</button>
  </div>

  <script>
    // --- వెబ్ ఆడియో సౌండ్ ఇంజిన్ (Game Sounds) ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      // డైస్ రోలింగ్ సౌండ్
      playDice() {
        this.init();
        for (let i = 0; i < 6; i++) {
          setTimeout(() => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140 + Math.random() * 80, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.05);
          }, i * 70);
        }
      },
      // కాయిన్ కదిలేటప్పుడు సౌండ్ (Step/Move)
      playStep() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      // ప్రత్యర్థి కట్ అయినప్పుడు బ్లాస్ట్ సౌండ్
      playCut() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(60, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      },
      // విన్నర్ ట్రంపెట్ మ్యూజిక్ (Victory)
      playWin() {
        this.init();
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        notes.forEach((freq, i) => {
          setTimeout(() => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.25);
          }, i * 140);
        });
      }
    };

    // బోర్డు పాత్
    const PATH = [
      {r:5, c:1}, {r:5, c:2}, {r:5, c:3}, {r:5, c:4}, 
      {r:4, c:5}, {r:3, c:5}, {r:2, c:5}, {r:1, c:5}, {r:1, c:6}, {r:1, c:7},
      {r:2, c:7}, {r:3, c:7}, {r:4, c:7}, {r:5, c:8}, {r:5, c:9}, {r:5, c:10}, {r:5, c:11},
      {r:6, c:11}, {r:7, c:11}, {r:7, c:10}, {r:7, c:9}, {r:7, c:8},
      {r:8, c:7}, {r:9, c:7}, {r:10, c:7}, {r:11, c:7}, {r:11, c:6}, {r:11, c:5},
      {r:10, c:5}, {r:9, c:5}, {r:8, c:5}, {r:7, c:4}, {r:7, c:3}, {r:7, c:2}, {r:7, c:1},
      {r:6, c:1}, {r:6, c:2}, {r:6, c:3}, {r:6, c:4}, {r:6, c:5}
    ];

    const SAFE_SPOTS = [0, 8, 17, 26];
    const WIN_STEP = PATH.length - 1;

    let peer = null, conn = null, myColor = '', currentTurn = 'red';
    let currentDice = null;
    let awaitingSelection = false;

    let tokens = {
      red: [-1, -1, -1, -1],
      blue: [-1, -1, -1, -1]
    };

    // గడులు రెండర్
    const boardEl = document.getElementById('ludoBoard');
    PATH.forEach((pt, idx) => {
      const cell = document.createElement('div');
      cell.className = 'l-cell';
      cell.style.gridRow = pt.r;
      cell.style.gridColumn = pt.c;
      cell.id = `cell-${pt.r}-${pt.c}`;

      if (SAFE_SPOTS.includes(idx)) cell.classList.add('star-cell');
      if (idx === WIN_STEP) cell.style.background = "#86efac";
      boardEl.appendChild(cell);
    });

    function startAsHost() {
      const code = document.getElementById('custom-room').value.trim();
      if(!code) return alert("కోడ్ ఇవ్వండి!");
      peer = new Peer('dilip-3d-ludo-' + code);
      myColor = 'red';

      peer.on('open', () => {
        document.getElementById('status-msg').innerText = `రూమ్ ${code} రెడీ! ఫ్రెండ్‌ను జాయిన్ అవ్వమనండి.`;
      });
      peer.on('connection', (c) => {
        conn = c;
        initGame("ఫ్రెండ్ జాయిన్ అయ్యారు! మీరు RED (మీ టర్న్).");
      });
      peer.on('error', () => alert("కోడ్ ఇప్పటికే వాడకంలో ఉంది!"));
    }

    function startAsJoin() {
      const code = document.getElementById('custom-room').value.trim();
      if(!code) return alert("కోడ్ ఇవ్వండి!");
      peer = new Peer();
      myColor = 'blue';

      peer.on('open', () => {
        conn = peer.connect('dilip-3d-ludo-' + code);
        initGame("కనెక్ట్ అయ్యారు! మీరు BLUE.");
      });
    }

    function initGame(msg) {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game-play').style.display = 'block';
      document.getElementById('turn-banner').innerText = msg;
      render();

      conn.on('data', (data) => {
        if(data.type === 'state_update') {
          tokens = data.tokens;
          currentTurn = data.nextTurn;
          animate3DDice(data.dice);
          render();
          if (data.alertMsg) {
            AudioEngine.playCut();
            alert(data.alertMsg);
          }
          if (data.winner) showWin(data.winner);
        }
      });
    }

    // 3D క్యూబ్ రొటేషన్ లాజిక్
    function animate3DDice(val) {
      const cube = document.getElementById('diceCube');
      AudioEngine.playDice();

      const rotations = {
        1: { x: 0, y: 0 },
        6: { x: 0, y: 180 },
        2: { x: 0, y: -90 },
        5: { x: 0, y: 90 },
        3: { x: -90, y: 0 },
        4: { x: 90, y: 0 }
      };

      const rot = rotations[val] || { x: 0, y: 0 };
      // గిరగిరా తిరగడానికి అదనంగా 720 డిగ్రీలు
      cube.style.transform = `translateZ(-30px) rotateX(${rot.x + 720}deg) rotateY(${rot.y + 720}deg)`;
    }

    function roll() {
      if (currentTurn !== myColor) return alert("ఇది మీ టర్న్ కాదు!");
      if (awaitingSelection) return alert("కాయిన్‌ను సెలెక్ట్ చేయండి!");

      currentDice = Math.floor(Math.random() * 6) + 1;
      animate3DDice(currentDice);

      const myTokens = tokens[myColor];
      let movable = [];
      myTokens.forEach((pos, idx) => {
        if (pos === -1 && currentDice === 6) movable.push(idx);
        else if (pos !== -1 && pos + currentDice <= WIN_STEP) movable.push(idx);
      });

      if (movable.length === 0) {
        setTimeout(() => changeTurn(null), 900);
      } else if (movable.length === 1 && myTokens[movable[0]] === -1 && currentDice === 6) {
        setTimeout(() => moveToken(movable[0]), 800);
      } else {
        awaitingSelection = true;
        highlightMovable(movable);
      }
    }

    function highlightMovable(movableIndices) {
      movableIndices.forEach(idx => {
        const el = document.getElementById(`token-${myColor}-${idx}`);
        if (el) el.classList.add('clickable');
      });
    }

    function onTokenClick(color, idx) {
      if (!awaitingSelection || color !== myColor) return;
      
      const pos = tokens[color][idx];
      if (pos === -1 && currentDice !== 6) return;
      if (pos !== -1 && pos + currentDice > WIN_STEP) return;

      awaitingSelection = false;
      moveToken(idx);
    }

    function moveToken(tokenIdx) {
      let pos = tokens[myColor][tokenIdx];
      let alertMsg = null;
      AudioEngine.playStep();

      if (pos === -1 && currentDice === 6) {
        tokens[myColor][tokenIdx] = (myColor === 'red') ? 0 : 17;
      } else {
        tokens[myColor][tokenIdx] += currentDice;
        let newPos = tokens[myColor][tokenIdx];

        // ప్రత్యర్థి కట్ చేయడం
        const opp = myColor === 'red' ? 'blue' : 'red';
        if (!SAFE_SPOTS.includes(newPos) && newPos !== WIN_STEP) {
          tokens[opp].forEach((oPos, oIdx) => {
            if (oPos === newPos) {
              tokens[opp][oIdx] = -1;
              alertMsg = "⚔️ ప్రత్యర్థి కాయిన్ కట్ అయింది! మళ్లీ ఇంటికి వెళ్లిపోయింది!";
              AudioEngine.playCut();
            }
          });
        }
      }

      let winner = tokens[myColor].every(p => p === WIN_STEP) ? myColor : null;
      let next = (currentDice === 6 || alertMsg) ? myColor : (myColor === 'red' ? 'blue' : 'red');
      changeTurn(winner, alertMsg, next);
    }

    function changeTurn(winner, alertMsg = null, explicitNext = null) {
      const next = explicitNext ? explicitNext : (myColor === 'red' ? 'blue' : 'red');
      currentTurn = next;
      awaitingSelection = false;
      render();

      if (alertMsg) alert(alertMsg);

      if (conn && conn.open) {
        conn.send({
          type: 'state_update',
          tokens: tokens,
          dice: currentDice,
          nextTurn: next,
          winner: winner,
          alertMsg: alertMsg
        });
      }

      if (winner) showWin(winner);
    }
